#:schema https://mise.jdx.dev/schema/mise.json
# Every script, tool and build task for the Odin rewrite lives here.

[tools]
# Odin is installed via Homebrew (`brew install odin`), not mise -- its
# formula bundles a matching raylib, plus lld/llvm, which mise's plugin does
# not provide. See docs/decisions.md D28.
# Ghidra 12 needs JDK 21+. Only used by the decomp:* tasks.
java = "temurin-21"

[env]
# Repository-relative anchors. DR_ORIG points at the extracted 1.0.2 install.
DR_SRC    = "{{config_root}}"
DR_ORIG   = "{{config_root}}/../game"
DR_ASSETS = "{{config_root}}/assets"
# Plugins' content folders (D51): each plugin's data, sprites, images and
# audio beside its code. The game falls back to plugins/ in its working
# directory, which is how a release is laid out. A value already in the
# environment wins (DR_PLUGINS=$PWD/tests/fixtures/plugins for the data
# plugin fixtures, D52).
DR_PLUGINS = "{{ get_env(name='DR_PLUGINS', default=config_root ~ '/plugins') }}"
DR_BUILD  = "{{config_root}}/build"
DR_DEPS   = "{{config_root}}/.deps"
# Ghidra itself is ~900 MB of tooling, so it lives in the user cache.
# Windows has no HOME (the CI runner's env lacks it, and mise's template
# errors on an undefined field rather than expanding to empty), so fall back
# to USERPROFILE there.
DR_GHIDRA = "{{ get_env(name='HOME', default=get_env(name='USERPROFILE', default='')) }}/.cache/deimos-rising/ghidra"
# The Ghidra project and corpus cannot live under a dotted path -- the headless
# analyser rejects any path element starting with '.' -- so they go in a
# gitignored work/ directory beside the repo's tracked files. Kept out of
# src/build/ so that `mise run clean` does not discard minutes of analysis.
DR_DECOMP = "{{config_root}}/../work/decomp"
# Wine prefix and the oracle's captures (traces, the sprite dump). A value
# already in the environment wins, so two oracles can run side by side on
# copies of the prefix (DR_WINE=../work/wine-b mise run oracle:trace);
# otherwise both would write to, and clear, the same traces directory.
DR_WINE   = "{{ get_env(name='DR_WINE', default=config_root ~ '/../work/wine') }}"
DR_EXE    = "{{config_root}}/../game/DeimosRising.exe"
DR_SYMS   = "{{config_root}}/../symbols/functions.csv"
# Python venv for the HD map upscaler (torch + diffusers, ~6 GB), and the
# Hugging Face cache it downloads FLUX.2 [klein] into (~16 GB) unless HF_HOME
# is already set. Kept out of the repo like Ghidra.
DR_HD_VENV = "{{ get_env(name='HOME', default=get_env(name='USERPROFILE', default='')) }}/.cache/deimos-rising/hd-venv"
# Marigold V2 for terrain:recover's height seed: its checkout, its own
# Python 3.10 venv and links to its weights (~45 GB, in the Hugging Face
# cache). Made by terrain:marigold-setup.
DR_MARIGOLD = "{{ get_env(name='HOME', default=get_env(name='USERPROFILE', default='')) }}/.cache/deimos-rising/marigold-v2"
# Odin collection so packages import as "dr:sim", "dr:data", ...
# Kept separate because `odin check` rejects linker flags.
DR_COLL   = "-collection:dr={{config_root}}"
DR_LINK   = "-extra-linker-flags:-L{{config_root}}/.deps/lib"
# Executable suffix for every -out: path. Odin on Windows refuses an output
# path without one ("must have an appropriate extension"), seen in CI.
DR_EXT    = "{% if os() == 'windows' %}.exe{% endif %}"

[tasks.setup]
description = "Create local dev symlinks for X11/GL so raylib links on immutable hosts"
run = "bash tools/setupdeps/setup.sh"

[tasks.build]
description = "Build the game binary"
depends = ["setup"]
run = "odin build game -out:$DR_BUILD/deimos$DR_EXT $DR_COLL $DR_LINK -o:speed -define:DR_VERSION=$(bash tools/version/version.sh)"

[tasks."build:editor"]
description = "Build the level editor (editor/, notes/level-editor-plan.md Stage 7)"
depends = ["setup"]
run = "odin build editor -out:$DR_BUILD/deimos-editor$DR_EXT $DR_COLL $DR_LINK -o:speed -define:DR_VERSION=$(bash tools/version/version.sh)"

[tasks."build:linux"]
description = "Build the game binary and the level editor for Linux (x86-64) -- `build` and `build:editor`, named explicitly for symmetry with build:windows"
depends = ["build", "build:editor"]

[tasks.editor]
description = "Build and run the level editor, on a project if given: mise run editor [path/level.drproj.json] (a new level otherwise). It opens a window: for a picture without one, editor:shot"
depends = ["build:editor"]
run = 'exec "$DR_BUILD/deimos-editor$DR_EXT" "$@"'

[tasks."editor:shot"]
description = "Draw one frame of the level editor headlessly ([PROJECT=path/level.drproj.json, a new level otherwise] [OUT=build/editor.png]); extra flags pass through, e.g. -- -tab=light -row=1500 -zoom=2 -tilt=50"
depends = ["build:editor"]
run = """
set -e
headless() {
  if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s "-screen 0 1920x1200x24" "$@"; fi
  env DISPLAY= WAYLAND_DISPLAY= "$@"
}
headless "$DR_BUILD/deimos-editor$DR_EXT" ${PROJECT:+"$PROJECT"} -shot="${OUT:-$DR_BUILD/editor.png}" "$@"
"""

[tasks.dist]
description = "Lay out the release folder, dist/deimos: the built binary (build or build:windows first), assets/ and each plugin's content in plugins/<name>/ (every file of src/plugins that is not Odin source; D51). CI zips it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf dist/deimos
mkdir -p dist/deimos/plugins
cp "$DR_BUILD/deimos$DR_EXT" dist/deimos/
# The level editor, when it was built (build:linux and build:windows do).
if [ -f "$DR_BUILD/deimos-editor$DR_EXT" ]; then cp "$DR_BUILD/deimos-editor$DR_EXT" dist/deimos/; fi
cp -r assets dist/deimos/
# Plugin folders that hold only code (and view/ subpackages) copy nothing.
(cd plugins && find . -type f ! -name '*.odin' | sort) | while read -r f; do
  mkdir -p "dist/deimos/plugins/$(dirname "$f")"
  cp "plugins/$f" "dist/deimos/plugins/$f"
done
'''

[tasks."build:windows"]
description = "Build the game binary for Windows (x86-64). Native on a Windows host (mise/Odin there just do an ordinary same-target build). Cross-compiling from Linux additionally needs vendor:raylib's windows/*.lib (absent from this Odin install's vendor tree) and currently fails outright regardless: this Odin toolchain's own linker refuses windows_amd64 cross-links from a linux_amd64 host ('Linking for cross compilation for this platform is not yet supported'), confirmed directly against it -- see docs/decisions.md D27. Does not depend on `setup` (that task materialises Linux-only X11/GL symlinks) or use $DR_LINK (Linux-only linker search path), neither of which apply to a Windows link."
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p "$DR_BUILD"
odin build game -out:"$DR_BUILD/deimos.exe" -target:windows_amd64 $DR_COLL -o:speed -define:DR_VERSION="$(bash tools/version/version.sh)"
odin build editor -out:"$DR_BUILD/deimos-editor.exe" -target:windows_amd64 $DR_COLL -o:speed -define:DR_VERSION="$(bash tools/version/version.sh)"
# odin build exits 0 even when this particular cross-link failure occurs
# (confirmed against this toolchain) and simply produces no binary, so a
# missing output file has to be checked for explicitly rather than trusted
# to show up as a nonzero exit code.
if [ ! -f "$DR_BUILD/deimos.exe" ] || [ ! -f "$DR_BUILD/deimos-editor.exe" ]; then
  echo "build:windows: no binary produced -- see this task's description and docs/decisions.md D27" >&2
  exit 1
fi
'''

[tasks.dev]
description = "Build unoptimised with debug info"
depends = ["setup"]
run = "odin build game -out:$DR_BUILD/deimos-dev$DR_EXT $DR_COLL $DR_LINK -debug -define:DR_VERSION=$(bash tools/version/version.sh)"

[tasks.run]
description = "Build and run the game"
depends = ["build"]
# Every launch flag the game itself parses (game/settings.odin's
# settings_parse) gets a matching flag here, so `mise run run --help` and
# `mise generate task-docs` stay the single source of truth for what's
# available -- add a line to both this usage block and settings_parse
# together whenever a new one lands.
usage = '''
flag "--classic" help="Reproduce -classic mode: hide the new (non-original) menu items such as the netplay lobby"
flag "--highrefreshrate" help="Reproduce -highrefreshrate mode: uncap the frame rate above the original's fixed step"
flag "--diagnostics" help="Show a rolling FPS/ping/rollback-rate overlay in the bottom-right corner"
flag "--fullscreen" help="Start fullscreen (a borderless window covering the monitor), the game scaled to fit"
flag "--campaign <plugin>" help="Pick a campaign plugin, on for the run; with --level or --row, play it straight away"
flag "--level <identifier>" help="Play this level (Lucena, or le07) straight away; the campaign's first by default"
flag "--row <n>" help="Play from map row n, the view's top, instead of the map's bottom"
flag "--plugins <dir>" help="One more plugins root, searched before DR_PLUGINS"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=()
[ "${usage_classic:-false}" = "true" ] && args+=(-classic)
[ "${usage_highrefreshrate:-false}" = "true" ] && args+=(-highrefreshrate)
[ "${usage_diagnostics:-false}" = "true" ] && args+=(-diagnostics)
[ "${usage_fullscreen:-false}" = "true" ] && args+=(-fullscreen)
[ -n "${usage_campaign:-}" ] && args+=(-campaign "$usage_campaign")
[ -n "${usage_level:-}" ] && args+=(-level "$usage_level")
[ -n "${usage_row:-}" ] && args+=(-row "$usage_row")
[ -n "${usage_plugins:-}" ] && args+=(-plugins "$usage_plugins")
exec "$DR_BUILD/deimos$DR_EXT" "${args[@]}"
'''

[tasks.version]
description = "Print the version this commit builds as (v<VERSION>.<commit count>; -local outside CI)"
run = "bash tools/version/version.sh"

[tasks."release:notes"]
description = "Preview the release notes CI would publish for HEAD: the Changelog: blocks since the last release (format in AGENTS.md)"
run = "bash tools/version/release_notes.sh"

[tasks."readme:screenshot"]
description = "Regenerate docs/images/main-menu.png, the README's main menu screenshot (hidden window, offscreen render)"
depends = ["build"]
run = "DR_MENU_SHOT=main_netplay DR_SHOT=docs/images/main-menu $DR_BUILD/deimos$DR_EXT"

[tasks.check]
description = "Type-check and vet every package"
depends = ["setup"]
run = [
  "odin check game $DR_COLL -vet -strict-style",
  "odin check sim  $DR_COLL -vet -strict-style -no-entry-point",
  "for p in sim/*/ sim/systems/*/; do [ -d $p ] && [ \"$(basename $p)\" != systems ] || continue; odin check $p $DR_COLL -vet -strict-style -no-entry-point || exit 1; done",
  "odin check data $DR_COLL -vet -strict-style -no-entry-point",
  "odin check net  $DR_COLL -vet -strict-style -no-entry-point",
  "odin check prefs $DR_COLL -vet -strict-style -no-entry-point",
  "odin check render $DR_COLL -vet -strict-style -no-entry-point",
  "odin check ui $DR_COLL -vet -strict-style -no-entry-point",
  "odin check oracle $DR_COLL -vet -strict-style -no-entry-point",
  # A data plugin's folder holds no code (D52).
  "for p in plugins/*/ plugins/*/view/; do ls $p*.odin >/dev/null 2>&1 || continue; odin check $p $DR_COLL -vet -strict-style -no-entry-point || exit 1; done",
  "odin check tools/extract $DR_COLL -vet -strict-style",
  "odin check tools/verify  $DR_COLL -vet -strict-style",
  "odin check tools/records $DR_COLL -vet -strict-style",
  "odin check tools/simbench $DR_COLL -vet -strict-style",
  "odin check tools/simbench $DR_COLL -vet -strict-style -define:DR_SIM_PROFILE=true",
  "odin check tools/diff    $DR_COLL -vet -strict-style",
  "odin check tools/rngcheck $DR_COLL -vet -strict-style",
  "odin check tools/icons   $DR_COLL -vet -strict-style",
  "odin check tools/recolour $DR_COLL -vet -strict-style",
  "odin check tools/dps     $DR_COLL -vet -strict-style",
  "odin check tools/clips   $DR_COLL -vet -strict-style",
  "odin check terrain $DR_COLL -vet -strict-style -no-entry-point",
  "odin check tools/terrain $DR_COLL -vet -strict-style",
  "odin check tests/terrain $DR_COLL -vet -strict-style -no-entry-point",
  "odin check editor $DR_COLL -vet -strict-style",
  "odin check tests/editor $DR_COLL -vet -strict-style -no-entry-point",
]

[tasks.test]
description = "Run the Odin test suite: tests/, then tests/data_plugins, a package of its own because it registers the fixture plugins in tests/fixtures/plugins (D52), then tests/terrain and tests/editor, which draw through GL under xvfb-run (skipped without a display)"
depends = ["setup"]
run = [
  "odin test tests $DR_COLL $DR_LINK -out:$DR_BUILD/tests$DR_EXT",
  "odin test tests/data_plugins $DR_COLL $DR_LINK -out:$DR_BUILD/tests-data-plugins$DR_EXT",
  # Never on the desktop: under xvfb-run, or with no display at all, when
  # the GL cases skip.
  "if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s '-screen 0 1280x1024x24'; fi; env DISPLAY= WAYLAND_DISPLAY= \"$@\" odin test tests/terrain $DR_COLL $DR_LINK -out:$DR_BUILD/tests-terrain$DR_EXT",
  "if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s '-screen 0 1280x1024x24'; fi; env DISPLAY= WAYLAND_DISPLAY= \"$@\" odin test tests/editor $DR_COLL $DR_LINK -out:$DR_BUILD/tests-editor$DR_EXT",
]

[tasks.coverage]
description = "Block coverage of the simulation by the test suite (build/coverage/missed.txt lists what never ran)"
depends = ["setup"]
run = [
  "python3 tools/coverage/coverage.py instrument . $DR_BUILD/coverage",
  "rm -f $DR_BUILD/coverage/hits.bin",
  "DR_COV_OUT=$DR_BUILD/coverage/hits.bin odin test $DR_BUILD/coverage/tests -collection:dr=$DR_BUILD/coverage $DR_LINK -out:$DR_BUILD/coverage/run-tests$DR_EXT",
  "python3 tools/coverage/coverage.py report $DR_BUILD/coverage",
]

[tasks.purity]
description = "Enforce: sim/ imports no raylib and performs no I/O"
run = "bash tools/purity/check.sh"

[tasks."decomp:setup"]
description = "Download and unpack Ghidra into the user cache (idempotent)"
run = "bash tools/decomp/setup.sh"

[tasks."decomp:export"]
description = "Headless Ghidra: import our symbols, decompile, export C per function"
depends = ["decomp:setup"]
run = "bash tools/decomp/export.sh"

[tasks."decomp:reanalyse"]
description = "Discard the Ghidra project and re-import from scratch (several minutes)"
depends = ["decomp:setup"]
run = "bash tools/decomp/export.sh --reanalyse"

[tasks."decomp:find"]
description = "Find decompiled functions by name substring; -c prints the source"
run = "bash tools/decomp/find.sh"

[tasks."decomp:layout"]
description = "Recover definition struct layouts (key -> offset) from the loaders into symbols/layouts/"
run = "python3 tools/decomp/layout.py $DR_EXE $DR_DECOMP/export ../symbols/layouts --odin sim/defs_gen.odin"

[tasks."decomp:tables"]
description = "Regenerate sim/math_tables.odin (U_Math sin/cos/atan tables, bit-exact)"
run = "python3 tools/decomp/math_tables.py sim/math_tables.odin"

[tasks."decomp:sites"]
description = "List RandomInt/RandomFloat call sites (return addresses) by function; optional name filter"
run = "python3 tools/decomp/sites.py $DR_EXE $DR_DECOMP/export/index.tsv"

[tasks."decomp:peek"]
description = "Read initialised globals from the executable: 0x4e34b8:f 0x4e0666:u ..."
run = "python3 tools/decomp/peek.py $DR_EXE"

[tasks."decomp:index"]
description = "Summarise the exported decomp corpus"
run = "bash tools/decomp/index.sh"

[tasks."oracle:fetch"]
description = "Download QuickTime 7.6.9 (checksum-pinned) for the Wine oracle"
run = "bash tools/oracle/fetch.sh"

[tasks."oracle:prefix"]
description = "Build a network-isolated Wine prefix that runs the original game"
run = "bash tools/oracle/prefix.sh"

[tasks."oracle:run"]
description = "Run the original under Xvfb and screenshot it; args are seconds"
run = "bash tools/oracle/run.sh"

[tasks."oracle:trace"]
description = "Play the original's demos under gdb, logging RNG draws per step; arg is seconds"
run = "bash tools/oracle/trace.sh"

[tasks."oracle:tables"]
description = "Dump the original's U_Math lookup tables (sin/cos/atan/sqrt) from memory"
run = "bash tools/oracle/tables.sh"

[tasks."oracle:sprites"]
description = "Dump the original's sprite frame dimensions (ground truth for the plate scanner)"
run = "bash tools/oracle/sprites.sh"

[tasks."oracle:shot"]
description = "Screenshot the original stopped at exact game steps (DEMO=n STEPS=a,b,c)"
run = "bash tools/oracle/shot.sh"

[tasks."shots:compare"]
description = "Our render beside the original's, same film and step (FILM=de01 STEPS=900)"
depends = ["build"]
run = "bash tools/oracle/compare.sh"

[tasks."oracle:menu-shot"]
description = "Screenshot the original's menu screens under Wine (MENU=main); slow"
run = "bash tools/oracle/menu_shot.sh"

[tasks."menu-shots:compare"]
description = "Our menu render beside the original's (MENU=main); slow, needs oracle:menu-shot first"
depends = ["build"]
run = "bash tools/oracle/menu_compare.sh"

[tasks."menu-shot"]
description = "Render one of our own menu screens headlessly, no comparison (MENU=main [OUT=path]; MENU=restarted checks a new game starts with none of the last one's particles; DR_SHOT_HUE=63 sets the accent on preferences_extras; MENU=preferences_mods shows the Mods page, and preferences_mods_end its last rows (DR_PLUGINS=$PWD/tests/fixtures/plugins:$PWD/plugins adds the data plugin fixtures; MENU=level_select_campaigns shows Level Select on the fixture campaign, and netplay_lobby_campaigns the host's lobby); MENU=reward, reward_2p and level_select_easy show easy mode; MENU=loadout, loadout_2p, loadout_placed, chaingun, chaingun_charge, chaingun_release, discharge_windup, discharge, discharge_charge, discharge_motes and discharge_burst show New Weapons; MENU=rear_gun_side shows the Rear Gun's side volleys) -- for a quick look, or debug MENU cases from run_menu_shot"
depends = ["build"]
# Wrapped in xvfb-run/DISPLAY= exactly like the shots and menu-shots:compare
# tasks -- running $DR_BUILD/deimos directly (without this) opens a real
# window against whatever DISPLAY the shell inherits, on the real desktop.
# HOME (and any other env var the game itself reads, e.g. for progress
# persistence -- see game/progress.odin) passes through untouched: set it
# with the usual shell-prefix form, `HOME=/tmp/x mise run menu-shot ...`.
run = '''
#!/usr/bin/env bash
set -euo pipefail
MENU="${MENU:-main}"
OUT="${OUT:-$DR_SRC/../work/shots/menus/$MENU/ours}"
mkdir -p "$(dirname "$OUT")"
rm -f "$OUT.png"
# Without xvfb-run (not every dev machine has it) the shot opens a window on
# the current display for a moment instead.
XVFB=()
if command -v xvfb-run >/dev/null; then XVFB=(env DISPLAY= xvfb-run -s "-screen 0 1280x1024x24"); fi
"${XVFB[@]}" env DR_ASSETS="$DR_ASSETS" DR_MENU_SHOT="$MENU" DR_SHOT="$OUT" \
  "$DR_BUILD/deimos" 2>&1 | grep -E "^wrote|^cannot|particles," || true
[ -f "$OUT.png" ] || { echo "menu-shot: no image written for MENU=$MENU" >&2; exit 1; }
echo "$OUT.png"
'''

[tasks."weapon-clips"]
description = "Record a short GIF of each weapon in play on the stage it unlocks: taps, then a charge and its release (WEAPONS='aiic aibg airg aipb aicg aidb plbo' by default, OUT=../work/clips; KEEP_FRAMES=1 keeps the PNG frames in OUT/frames). Headless. See tools/clips"
depends = ["setup"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
OUT="${OUT:-$DR_SRC/../work/clips}"
rm -rf "$OUT/frames"
mkdir -p "$OUT"
odin build tools/clips $DR_COLL $DR_LINK -o:speed -out:$DR_BUILD/clips$DR_EXT
XVFB=()
if command -v xvfb-run >/dev/null; then XVFB=(env DISPLAY= xvfb-run -a -s "-screen 0 1280x1024x24"); fi
"${XVFB[@]}" "$DR_BUILD/clips$DR_EXT" "$DR_ASSETS" "$OUT/frames" ${WEAPONS:-aiic aibg airg aipb aicg aidb plbo} |
while read -r tag slug dir; do
  [ "$tag" = clip ] || continue
  # The play field only (x 32-448 of the 640 screen), at 15 fps and 64
  # colours: the scrolling terrain changes every pixel of every frame,
  # which GIF compresses badly, so this keeps a clip to a few MB.
  ffmpeg -loglevel error -y -framerate 30 -pattern_type glob -i "$dir/*.png" \
    -vf "crop=832:960:64:0,scale=360:-1:flags=lanczos,fps=15,split[a][b];[a]palettegen=max_colors=64:stats_mode=full[p];[b][p]paletteuse=dither=bayer:bayer_scale=5" \
    -loop 0 "$OUT/$slug.gif"
  echo "$OUT/$slug.gif"
done
[ -n "${KEEP_FRAMES:-}" ] || rm -rf "$OUT/frames"
'''

[tasks."shots"]
description = "Render our own frames of a demo film (FILM=de01 AT=a,b,c)"
depends = ["build"]
run = """
mkdir -p ../work/shots/ours
DISPLAY= xvfb-run -s "-screen 0 1280x1024x24" env \
  DR_ASSETS=$DR_ASSETS DR_FILM=${FILM:-de01} \
  DR_SHOT=$DR_SRC/../work/shots/ours/${FILM:-de01} DR_SHOT_AT=${AT:-900} \
  $DR_BUILD/deimos 2>&1 | grep -E "^wrote|^cannot" || true
"""

[tasks."shots:find"]
description = "Steps of a demo film where a drawn sprite matches FIND, e.g. FIND='pbta frame 1' (FILM=de01 UNTIL=2400); no images, one run"
depends = ["build"]
run = """
DR_ASSETS=$DR_ASSETS DR_FILM=${FILM:-de01} DR_SHOT=/dev/null DR_SHOT_AT=${UNTIL:-2400} \
  DR_SHOT_FIND="${FIND:?set FIND to text from a DR_DUMP line}" \
  $DR_BUILD/deimos 2>&1 | grep -E "^step|: [0-9]+ of" || true
"""

[tasks."oracle:diff"]
description = "Compare the simulation's random calls with the original's trace, per demo film"
run = "odin run tools/diff $DR_COLL -out:$DR_BUILD/oracle-diff$DR_EXT --"

[tasks."oracle:diff:saved"]
description = "Compare the simulation with the committed traces in tests/oracle (shipped demos and players' films); needs the Wine prefix's install (or DR_ORIG_FULL) and assets:films"
run = """
set -e
orig="${DR_ORIG_FULL:-$DR_WINE/prefix/drive_c/DR}"
odin build tools/diff $DR_COLL -o:speed -out:$DR_BUILD/oracle-diff$DR_EXT
mkdir -p $DR_BUILD/traces
status=0
for t in tests/oracle/*.trace.xz; do
  n=$(basename "$t" .trace.xz)
  xz -dc "$t" > "$DR_BUILD/traces/$n.txt"
  echo "== $n"
  DR_ORIG="$orig" $DR_BUILD/oracle-diff$DR_EXT "$DR_BUILD/traces/$n.txt" || status=1
done
exit $status
"""

[tasks.bench]
description = "Time the simulation alone: demo replays, every level in co-op, and rollback snapshots (needs extracted assets)"
run = "odin run tools/simbench $DR_COLL -o:speed -out:$DR_BUILD/simbench$DR_EXT"

[tasks."bench:profile"]
description = "Where a step's time goes, by system and stage: the bench, built with the simulation's cycle counting"
run = "odin run tools/simbench $DR_COLL -o:speed -define:DR_SIM_PROFILE=true -out:$DR_BUILD/simbench-profile$DR_EXT"

[tasks."rng:determinism"]
description = "Build tools/rngcheck under several codegen configs (-o:none/-speed, -microarch:native, explicit -target-features:fma) and confirm they all print the same RNG digest -- the practical stand-in, on a host with no working Windows cross-link and no second OS to test against, for 'does sim/'s RNG produce the same bits on every platform' (see docs/decisions.md D27 and tests/rand_test.odin's rand_sequence_digest_is_codegen_stable)"
run = "bash tools/rngcheck/determinism_check.sh"

[tasks."netplay:loopback"]
description = "Two-instance loopback smoke test for the netplay lobby and live rollback session (Phase 7 stage 6 / Phase 6 stage 5)"
depends = ["build"]
run = "bash tools/netplay/loopback_check.sh"

[tasks."netplay:reconnect"]
description = "Three-instance loopback smoke test for pause-on-disconnect + reconnect: kills the guest mid-session, waits for the host to notice and rebind, then joins a fresh instance and checks the resync completes (Phase 8 stage 3/4)"
depends = ["build"]
run = "bash tools/netplay/reconnect_check.sh"

[tasks."netplay:level-end"]
description = "Two instances play the end of the first level together with Easy Mode on, headless and silent, and must both reach the reward screen and stay up (the crash of D50). END=150 steps before the end; HOST_BIN or GUEST_BIN runs one side on another build; KEEP=1 keeps the logs"
depends = ["build"]
run = "bash tools/netplay/level_end_check.sh"

[tasks."netplay:lobby-shots"]
description = "Screenshot every visually distinct netplay lobby state plus the diagnostics overlay, no comparison (there is no original to compare against) -- just for a quick look"
depends = ["build"]
# Same one-frame-no-comparison idea as `menu-shot`, just looped over every
# Netplay_Phase case run_menu_shot knows about (game/main.odin), since the
# lobby has no original screen for menu-shots:compare to check it against.
# "diagnostics" piggybacks on the same connected-lobby screen to also check
# game/diagnostics.odin's overlay (notes/netcode-enhancements.md).
run = '''
#!/usr/bin/env bash
set -euo pipefail
for MENU in preferences_extras preferences_mods netplay_lobby netplay_lobby_name netplay_lobby_join netplay_lobby_connecting netplay_lobby_connected \
            netplay_lobby_connected_host netplay_lobby_connected_host_locked netplay_lobby_campaigns diagnostics; do
  MENU="$MENU" mise run menu-shot
done
'''

[tasks."assets:extract"]
description = "Extract original PAKs into modern formats (PNG/WAV/JSON) under assets/, and the levels' own images under plugins/classic_levels/"
depends = ["setup"]
run = "odin run tools/extract $DR_COLL $DR_LINK -out:$DR_BUILD/extract$DR_EXT -- $DR_ORIG $DR_ASSETS \"$DR_PLUGINS\""

[tasks."addons:extract"]
description = "Unpack orig/deimos_addons.sit (fan mods, demo films, the Mac 1.0.6 bundle update) into work/addons/ for study; needs unar and hfsutils"
run = "bash ../tools/extract_addons.sh"

[tasks."terrain:build"]
description = "Build the level project tool (tools/terrain)"
depends = ["setup"]
run = "odin build tools/terrain $DR_COLL $DR_LINK -o:speed -out:$DR_BUILD/terrain$DR_EXT"

[tasks."terrain:render"]
description = "Draw a level project headlessly (PROJECT=path/le07.drproj.json [OUT=path/stem] [OUTPUT=lit|albedo|normal|height|shadow|occlusion|all, default all] [SCALE=1]; extra flags pass through, e.g. -- -quantise)"
depends = ["terrain:build"]
run = """
set -e
[ -n "$PROJECT" ] || { echo "terrain:render: set PROJECT=path/to/level.drproj.json" >&2; exit 2; }
headless() {
  if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s "-screen 0 1280x1024x24" "$@"; fi
  env DISPLAY= WAYLAND_DISPLAY= "$@"
}
headless "$DR_BUILD/terrain$DR_EXT" render "$PROJECT" "${OUT:-${PROJECT%.drproj.json}.render}" -output=${OUTPUT:-all} -scale=${SCALE:-1} "$@"
"""

[tasks."terrain:compare"]
description = "Score a level project's render against the original map: shadow IoU, shadow light, fitted sun azimuth, and a side-by-side PNG (PROJECT=... [ORIGINAL=map.png MASK=mask.png, default the level's own from the Classic Levels plugin] [OUT=side.png]; -- -from=ROW -to=ROW for a part)"
depends = ["terrain:build"]
run = """
set -e
[ -n "$PROJECT" ] || { echo "terrain:compare: set PROJECT=path/to/level.drproj.json" >&2; exit 2; }
headless() {
  if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s "-screen 0 1280x1024x24" "$@"; fi
  env DISPLAY= WAYLAND_DISPLAY= "$@"
}
headless "$DR_BUILD/terrain$DR_EXT" compare "$PROJECT" $ORIGINAL $MASK -images="$DR_PLUGINS/classic_levels/images/im16" \
  -out="${OUT:-${PROJECT%.drproj.json}.compare.png}" -fit "$@"
"""

[tasks."terrain:recover"]
description = "Recover a level project from an original map (LEVEL=le07 into work/terrain/LEVEL/, or OUT=dir): Marigold V2 heights refined against the shadows (-- --seed depth-anything for the fallback), water from the mask and moved to the art's shoreline, the canopy split off, the renderer's light divided out of the colour; in the terrain:marigold-setup venv"
depends = ["terrain:build"]
run = """
set -e
PY="$DR_MARIGOLD/venv/bin/python"; [ -x "$PY" ] || PY="$DR_MARIGOLD/venv/Scripts/python.exe"
[ -x "$PY" ] || { echo "no venv at $DR_MARIGOLD/venv: run 'mise run terrain:marigold-setup' first"; exit 1; }
LEVEL="${LEVEL:-le07}"
REC="$DR_PLUGINS/classic_levels/data/levels/$LEVEL.json"
MAP=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1]))['background_image'])" "$REC")
MASK=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1]))['media_mask'])" "$REC")
"$PY" tools/terrain_recover/recover.py "$MAP" --mask "$MASK" --level "$REC" --renderer "$DR_BUILD/terrain$DR_EXT" \
  --images "$DR_PLUGINS/classic_levels/images/im16" --out "${OUT:-$DR_SRC/../work/terrain/$LEVEL}" "$@"
"""

[tasks."terrain:relight"]
description = "Refit a recovered level's colour to its occlusion layer (LEVEL=le07 in work/terrain/LEVEL/, or OUT=dir): the layer fitted to the original's shadows and divided out with the rest of the light, the water refitted over its lit bed; no model runs, after terrain:occlusion"
depends = ["terrain:build"]
run = """
set -e
PY="$DR_MARIGOLD/venv/bin/python"; [ -x "$PY" ] || PY="$DR_MARIGOLD/venv/Scripts/python.exe"
[ -x "$PY" ] || { echo "no venv at $DR_MARIGOLD/venv: run 'mise run terrain:marigold-setup' first"; exit 1; }
LEVEL="${LEVEL:-le07}"
REC="$DR_PLUGINS/classic_levels/data/levels/$LEVEL.json"
MAP=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1]))['background_image'])" "$REC")
MASK=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1]))['media_mask'])" "$REC")
"$PY" tools/terrain_recover/recover.py "$MAP" --mask "$MASK" --level "$REC" --renderer "$DR_BUILD/terrain$DR_EXT" \
  --images "$DR_PLUGINS/classic_levels/images/im16" --out "${OUT:-$DR_SRC/../work/terrain/$LEVEL}" --relight "$@"
"""

[tasks."terrain:recover-all"]
description = "Recover every Classic Levels map into work/recovered/LEVEL/, bake its occlusion, refit its colour to it (terrain:relight), and score them all (terrain:report); LEVELS='le01 le07' for some"
depends = ["terrain:build"]
run = '''
set -e
DIR="$DR_SRC/../work/recovered"
LEVELS="${LEVELS:-$(ls "$DR_PLUGINS/classic_levels/data/levels" | sed -n 's/\.json$//p')}"
for L in $LEVELS; do
  echo "== $L"
  LEVEL="$L" OUT="$DIR/$L" mise run terrain:recover
  PROJECT="$DIR/$L/$L.drproj.json" mise run terrain:occlusion
  LEVEL="$L" OUT="$DIR/$L" mise run terrain:relight
done
LEVELS="$LEVELS" mise run terrain:report
'''

[tasks."terrain:report"]
description = "Score each recovered level in work/recovered/ against its original (terrain:compare, drawn with its occlusion layer as the game draws it, and without it for reference) into work/recovered/report.md; LEVELS='le01 le07' for some"
depends = ["terrain:build"]
run = '''
set -e
DIR="$DR_SRC/../work/recovered"
LEVELS="${LEVELS:-$(ls "$DR_PLUGINS/classic_levels/data/levels" | sed -n 's/\.json$//p')}"
REPORT="$DIR/report.md"
{
  echo "# Recovered Classic Levels"
  echo
  echo "terrain:compare on each project, whole map, $(date +%Y-%m-%d), drawn with its occlusion layer as the game draws it. terrain:relight fits the colour to that layer (D59), so the draw without it is darker in the art's shadows than the original and is kept only for reference. The plan's bar: shadow IoU 0.75."
  echo
  echo "| Level | Shadow IoU | Shadow light (render / original) | Fitted azimuth (cast IoU) | Water: levels from the original, share of its grain | Shadow IoU without occlusion |"
  echo "|---|---|---|---|---|---|"
} > "$REPORT"
for L in $LEVELS; do
  echo "== $L"
  P="$DIR/$L/$L.drproj.json"
  PROJECT="$P" mise run terrain:compare -- -no-occlusion | tee "$DIR/$L/compare.txt"
  PROJECT="$P" OUT="$DIR/$L/$L.compare-occlusion.png" mise run terrain:compare | tee "$DIR/$L/compare-occlusion.txt"
  C="$DIR/$L/compare-occlusion.txt"
  IOU=$(sed -n 's/^shadow IoU \([0-9.]*\).*/\1/p' "$C")
  LIGHT=$(sed -n 's/^shadow light: original \([0-9.]*\), render \([0-9.]*\).*/\2 \/ \1/p' "$C")
  AZ=$(sed -n 's/^fitted azimuth \([0-9]*\) (cast-shadow IoU \([0-9.]*\)).*/\1° (\2)/p' "$C")
  WATER=$(sed -n 's/^water: \([0-9.]*\) levels from the original, \([0-9.]*\) of its grain/\1, \2/p' "$C")
  BARE=$(sed -n 's/^shadow IoU \([0-9.]*\).*/\1/p' "$DIR/$L/compare.txt")
  echo "| $L | $IOU | $LIGHT | $AZ | $WATER | $BARE |" >> "$REPORT"
done
cat "$REPORT"
'''

[tasks."terrain:mod"]
description = "Package the levels recovered in work/recovered/ as the Recovered Levels campaign plugin (plugins/recovered_levels): each drawn lit with its occlusion as its map, the original's record otherwise; OUT=dir for elsewhere"
depends = ["terrain:build"]
run = '''
set -e
headless() {
  if command -v xvfb-run >/dev/null; then set -- xvfb-run -a -s "-screen 0 1280x1024x24" "$@"; fi
  env DISPLAY= WAYLAND_DISPLAY= "$@"
}
headless python3 tools/terrain_mod/package.py --recovered "$DR_SRC/../work/recovered" \
  --classic "$DR_SRC/plugins/classic_levels" --renderer "$DR_BUILD/terrain$DR_EXT" --out "${OUT:-$DR_SRC/plugins/recovered_levels}"
'''

[tasks."terrain:occlusion"]
description = "Bake a level project's occlusion layer, how open to the sky each pixel is, from its colour with Flux 2 [klein] (PROJECT=...; in the hd:setup venv)"
depends = ["terrain:build"]
run = """
set -e
[ -n "$PROJECT" ] || { echo "terrain:occlusion: set PROJECT=path/to/level.drproj.json" >&2; exit 2; }
PY="$DR_HD_VENV/bin/python"; [ -x "$PY" ] || PY="$DR_HD_VENV/Scripts/python.exe"
[ -x "$PY" ] || { echo "no venv at $DR_HD_VENV: run 'mise run hd:setup' first"; exit 1; }
"$PY" tools/terrain_occlusion/occlusion.py "$PROJECT" --renderer "$DR_BUILD/terrain$DR_EXT" "$@"
"""

[tasks."terrain:marigold-setup"]
description = "Set up Marigold V2 for terrain:recover in DR_MARIGOLD: the pinned checkout and patch, a Python 3.10 venv (torch from TORCH_INDEX, default CUDA 12.8), the weights at pinned revisions (~45 GB)"
run = "sh tools/terrain_recover/setup_marigold.sh"

[tasks."hd:setup"]
description = "Create the Python venv for hd:upscale (torch from TORCH_INDEX, default CUDA 12.8; see tools/hd_upscale/README.md for ROCm)"
run = """
set -e
TORCH_INDEX="${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}"
[ -d "$DR_HD_VENV" ] || python3 -m venv "$DR_HD_VENV"
PY="$DR_HD_VENV/bin/python"; [ -x "$PY" ] || PY="$DR_HD_VENV/Scripts/python.exe"
"$PY" -m pip install --upgrade pip
"$PY" -m pip install --index-url "$TORCH_INDEX" torch
"$PY" -m pip install -r tools/hd_upscale/requirements.txt
"$PY" -c "import torch; print('torch', torch.__version__, 'GPU:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"
"""

[tasks."hd:upscale"]
description = "Upscale a level map 4x with Flux detail transfer into work/hd/MAP/ (MAP=jum2 is level 1; resumable; extra flags pass through, e.g. -- --limit 2)"
run = """
set -e
PY="$DR_HD_VENV/bin/python"; [ -x "$PY" ] || PY="$DR_HD_VENV/Scripts/python.exe"
[ -x "$PY" ] || { echo "no venv at $DR_HD_VENV: run 'mise run hd:setup' first"; exit 1; }
"$PY" tools/hd_upscale/upscale.py "${MAP:-jum2}" --images "$DR_PLUGINS/classic_levels/images/im16" --out "$DR_SRC/../work/hd/${MAP:-jum2}" "$@"
"""

[tasks."assets:records"]
description = "Decode the tagged-text resources into JSON under assets/data/, and the levels under plugins/classic_levels/data/levels/"
depends = ["setup"]
run = "odin run tools/records $DR_COLL $DR_LINK -out:$DR_BUILD/records$DR_EXT -- $DR_ASSETS \"$DR_PLUGINS\""

[tasks."assets:all"]
description = "Extract media, decode records and composite the icons made from them"
depends = ["assets:extract", "assets:records"]
# After the extraction, not beside it: both are drawn from its sprites.
run = ["mise run assets:icons", "mise run assets:extra"]

[tasks."assets:icons"]
description = "Composite icons from the extracted sprites, per a recipe of layered sprite frames (RECIPE=tools/icons/passives.json OUT=assets/icons/passives by default: easy mode's 32x32 passive icons, one PNG per sim.Passive, named after it in lower case). To add one, add an entry to the recipe and rerun; MENU=reward mise run menu-shot shows them in place"
depends = ["setup"]
# CPU-side raylib image calls only: no window and no audio device are opened.
run = """
odin run tools/icons $DR_COLL $DR_LINK -out:$DR_BUILD/icons$DR_EXT -- \
  "${RECIPE:-tools/icons/passives.json}" "$DR_ASSETS" "${OUT:-$DR_ASSETS/icons/passives}"
"""

[tasks."assets:extra"]
description = "Recolour extracted sprite plates into the plugins' own, one recipe per plugin (RECIPE=tools/recolour/new_weapons.json for one; every tools/recolour/*.json by default). Each writes plugins/<plugin>/sprites/, which the game loads beside its own sprites while that plugin is in the build; the records in plugins/<plugin>/data are written by hand"
depends = ["setup"]
# CPU-side raylib image calls only: no window and no audio device are opened.
run = """
odin build tools/recolour $DR_COLL $DR_LINK -out:$DR_BUILD/recolour$DR_EXT
for recipe in ${RECIPE:-tools/recolour/*.json}; do
  $DR_BUILD/recolour$DR_EXT "$recipe" "$DR_ASSETS" "$DR_PLUGINS" || exit 1
done
"""

[tasks."dps:report"]
description = "Measure every weapon's damage per second in the simulation alone -- against one target ahead, a cluster of five, one target behind and a killable wave of nine, bare and with each passive at each level, as primary fire and as charge shots -- and write a dated HTML report (OUT=../work/reports by default; DPS_SECONDS=60 of play per run, DPS_STAGE=7). WEAPON='Rear Gun' measures that weapon alone and writes dps-<date>-rear-gun.html; the weapons are Ion Cannon, Bacta Gun, Rear Gun, Photon Beam, Chaingun, Discharge Beam and Plasma Bomb (case does not matter). See docs/dps-report.md"
depends = ["setup"]
# The sim only: no window, no audio device. Runs spread over every core.
run = """
odin build tools/dps $DR_COLL $DR_LINK -o:speed -out:$DR_BUILD/dps$DR_EXT && \
  "$DR_BUILD/dps$DR_EXT" "$DR_ASSETS" "${OUT:-$DR_SRC/../work/reports}" \
  -seconds:${DPS_SECONDS:-60} -stage:${DPS_STAGE:-7} ${WEAPON:+"-weapon:$WEAPON"}
"""

[tasks."assets:films"]
description = "Fetch the players' demo films for levels 1-11 from Macintosh Garden's add-ons archive (checksum-pinned, kept in orig/) and extract them to assets/films as pd01..pd11 and dl01, dl04..dl10; needs unar"
run = "bash tools/films/fetch.sh"

[tasks."assets:verify"]
description = "Verify extracted assets against the manifest and the original PAKs"
depends = ["setup"]
run = "odin run tools/verify $DR_COLL $DR_LINK -out:$DR_BUILD/verify$DR_EXT -- $DR_ORIG $DR_ASSETS \"$DR_PLUGINS\""

[tasks.ci]
description = "Everything CI runs"
depends = ["check", "purity", "test"]

[tasks.clean]
run = "rm -rf $DR_BUILD"
