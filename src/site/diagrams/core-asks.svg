  <text class="d-sub" x="248" y="120">extra_prefs</text>
  <rect class="d-box" x="236" y="136" width="170" height="26" rx="6"/>
  <text class="d-sub" x="248" y="154">fps_unlock</text>
  <rect class="d-box" x="236" y="170" width="170" height="26" rx="6"/>
  <text class="d-sub" x="248" y="188">netplay</text>
  <rect class="d-box" x="236" y="204" width="170" height="26" rx="6"/>
  <text class="d-sub" x="248" y="222">new_weapons</text>

  <path class="d-arrow" d="M166 120 Q200 120 200 47 H230"/>
  <path class="d-arrow" d="M166 126 Q206 126 206 81 H230"/>
  <path class="d-arrow" d="M166 132 Q190 132 190 115 H230"/>
  <path class="d-arrow" d="M166 140 Q190 140 190 149 H230"/>
  <path class="d-arrow" d="M166 146 Q206 146 206 183 H230"/>
  <path class="d-arrow" d="M166 152 Q200 152 200 217 H230"/>

  <rect class="d-box" x="460" y="34" width="140" height="34" rx="6"/>
  <text class="d-sub" x="472" y="56">easy_mode/view</text>
  <rect class="d-box" x="460" y="76" width="140" height="34" rx="6"/>
  <text class="d-sub" x="472" y="98">fps_unlock/view</text>
  <rect class="d-box" x="460" y="118" width="140" height="34" rx="6"/>
  <text class="d-sub" x="472" y="140">accent/view</text>
  <rect class="d-box" x="460" y="160" width="140" height="34" rx="6"/>
  <text class="d-sub" x="472" y="182">netplay · ...</text>

  <path class="d-arrow" style="marker-end: none" d="M600 51 H612 M600 93 H612 M600 135 H612 M600 177 H612 M612 51 V177"/>
  <path class="d-arrow" d="M612 99 H634"/>
  <text class="d-sub" x="460" y="216">each view registers</text>

  <rect class="d-box hot" x="640" y="34" width="226" height="130" rx="8"/>
