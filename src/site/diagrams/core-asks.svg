<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-label="Before: game/ imported six plugins and called into them at 29 places. After: each plugin's view registers with hooks in the core (setup switches, launch flags, frame rates, settings previews, menu shots, pauses and online plugins), and game/ walks those registries without naming any plugin.">
  <defs>
    <marker id="d-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-label" x="16" y="22">Before</text>
  <text class="d-label" x="460" y="22">After</text>
  <line class="d-lane" x1="436" y1="12" x2="436" y2="248"/>

  <rect class="d-box warm" x="16" y="104" width="150" height="62" rx="8"/>
  <text class="d-text" x="30" y="128">game/</text>
  <text class="d-sub" x="30" y="146">imports 6 plugins</text>
  <text class="d-sub" x="30" y="160">29 call sites</text>

