name: Build

# Native builds only -- one job per target OS, each building for itself.
# Odin's own linker refuses to cross-link windows_amd64 from a linux_amd64
# host (see src/docs/decisions.md D27), so there is no single-runner
# shortcut here; a real windows-latest runner sidesteps that entirely since
# it is not cross-compiling at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

# java in mise.toml is only for Ghidra's decomp:* tasks; without this,
# `mise run` auto-installs a 200 MB JDK on every job.
env:
  MISE_DISABLE_TOOLS: java

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: raylib's Linux link-time dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      # Odin comes from mise's own plugin here, not Homebrew (see D28) --
      # this local.toml is CI-only and gitignored, so it does not touch the
      # brew-based setup this repo's own mise.toml documents for local dev.
      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      - run: odin version
      - run: mise run ci
      - run: mise run build:linux
      - run: mise run rng:determinism

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-linux-amd64
          path: src/build/deimos

  build-windows:
    runs-on: windows-latest
    # mise runs inline tasks through `cmd /c` on Windows by default, which
    # would leave every $DR_* in mise.toml unexpanded; route them through Git
    # Bash so the same task definitions work on both runners.
    env:
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -o errexit -c
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      # The Windows release zip nests everything under dist/, which mise does
      # not recognise as the bin directory ("No executable found for
      # configured tool: odin"), and its shims fall back to .cmd files Git
      # Bash will not run anyway. Find odin.exe ourselves, and put it on PATH
      # both for bare steps and, via _.path, for the tasks mise spawns (which
      # do not inherit the $GITHUB_PATH entry).
      - name: Put Odin itself on PATH
        run: |
          exe=$(find "$(cygpath -u "$(mise where odin)")" -name odin.exe | head -1)
          [ -n "$exe" ] || { echo "odin.exe not found under $(mise where odin)" >&2; exit 1; }
          dir=$(cygpath -m "$(dirname "$exe")")
          echo "$dir" >> "$GITHUB_PATH"
          printf '[env]\n_.path = ["%s"]\n' "$dir" >> mise.local.toml
          cat mise.local.toml

      - run: odin version
      - run: mise run ci
      - run: mise run build:windows
      - run: mise run rng:determinism

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-windows-amd64
          path: src/build/deimos.exe
