name: Build

# Native builds only -- one job per target OS, each building for itself.
# Odin's own linker refuses to cross-link windows_amd64 from a linux_amd64
# host (see src/docs/decisions.md D27), so there is no single-runner
# shortcut here; a real windows-latest runner sidesteps that entirely since
# it is not cross-compiling at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

# java in mise.toml is only for Ghidra's decomp:* tasks; without this,
# `mise run` auto-installs a 200 MB JDK on every job.
env:
  MISE_DISABLE_TOOLS: java

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      # Full history: tools/version/version.sh numbers the build by its
      # commit count, and refuses a shallow clone rather than miscount.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: raylib's Linux link-time dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      # Odin comes from mise's own plugin here, not Homebrew (see D28) --
      # this local.toml is CI-only and gitignored, so it does not touch the
      # brew-based setup this repo's own mise.toml documents for local dev.
      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      - run: odin version
      - run: mise run ci
      - run: mise run build:linux
      - run: mise run rng:determinism

      # Zipped here rather than by upload-artifact, which drops the exec bit.
      # The game loads assets/ relative to its working directory (D29).
      - name: Zip the binary with its assets
        run: |
          mkdir -p dist/deimos && cp build/deimos dist/deimos/ && cp -r assets dist/deimos/
          cd dist && zip -9qr ../deimos-linux-amd64.zip deimos

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-linux-amd64
          path: src/deimos-linux-amd64.zip

  build-windows:
    runs-on: windows-latest
    # mise runs inline tasks through `cmd /c` on Windows by default, which
    # would leave every $DR_* in mise.toml unexpanded; route them through Git
    # Bash so the same task definitions work on both runners.
    env:
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -o errexit -c
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      # Full history: tools/version/version.sh numbers the build by its
      # commit count, and refuses a shallow clone rather than miscount.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      # The Windows release zip nests everything under dist/, which mise does
      # not recognise as the bin directory ("No executable found for
      # configured tool: odin"), and its shims fall back to .cmd files Git
      # Bash will not run anyway. Find odin.exe ourselves, and put it on PATH
      # both for bare steps and, via _.path, for the tasks mise spawns (which
      # do not inherit the $GITHUB_PATH entry).
      - name: Put Odin itself on PATH
        run: |
          exe=$(find "$(cygpath -u "$(mise where odin)")" -name odin.exe | head -1)
          [ -n "$exe" ] || { echo "odin.exe not found under $(mise where odin)" >&2; exit 1; }
          dir=$(cygpath -m "$(dirname "$exe")")
          echo "$dir" >> "$GITHUB_PATH"
          printf '[env]\n_.path = ["%s"]\n' "$dir" >> mise.local.toml
          cat mise.local.toml

      - run: odin version
      - run: mise run ci
      - run: mise run build:windows
      - run: mise run rng:determinism

      # raylib links statically on Windows (vendor:raylib's default), so the
      # exe plus assets/ is the whole program.
      - name: Zip the binary with its assets
        run: |
          mkdir -p dist/deimos && cp build/deimos.exe dist/deimos/ && cp -r assets dist/deimos/
          cd dist && 7z a -bso0 ../deimos-windows-amd64.zip deimos

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-windows-amd64
          path: src/deimos-windows-amd64.zip

  # One prerelease per push to main, carrying both platforms' zips, tagged
  # with the version both build jobs baked in (tools/version/version.sh --
  # the same commit always computes the same tag, so a re-run re-attaches
  # rather than minting a new one). The notes are the "Changelog:" blocks
  # of every commit since the previous release (tools/version/
  # release_notes.sh; format in AGENTS.md).
  release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(bash src/tools/version/version.sh)
          ls -l dist
          # A tag already on a different commit means history was rewritten
          # and the count repeated; publishing onto it would mislabel both.
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "$tag already tags $existing, not $GITHUB_SHA" >&2; exit 1; }
          fi
          bash src/tools/version/release_notes.sh > notes.md
          printf '\nUnzip and run deimos (Linux) or deimos.exe (Windows) from inside the unzipped folder. Built from %s (run %s).\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> notes.md
          cat notes.md
          # Create, then upload, so a re-run of the same commit re-attaches
          # files instead of failing on the existing tag. The API's asset
          # listing can lag the upload by minutes (seen on build-e3cab80), so
          # it is not used as a check here.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Deimos Rose $tag" \
            --notes-file notes.md \
            --prerelease
          gh release upload "$tag" dist/*.zip --clobber
